# 출시 빌드 — 태그 `v<판>` 을 올리면 세 OS 설치본 · 업데이트 파일(latest.json · .sig)을 만들어
# **초안(draft) 릴리스**에 올린다. 공개는 사람이 초안을 보고 한다.
# 수동 실행은 릴리스 없이 서명까지 끝낸 묶음을 이 실행의 artifact 로만 남긴다 (시험용).
#
# 작업을 키 · 쓰기 권한 기준으로 나눈다 — 의존성 코드(npm 설치 스크립트 · beforeBuildCommand · crate build.rs ·
# proc-macro)가 도는 build 작업에는 Secrets 도 쓰기 토큰도 없다.
#   verify    태그 = 판 확인 · CHANGELOG 노트                         (읽기)
#   build     세 OS 빌드 (업데이트 서명 끔) → 설치본 · 업데이트 파일     (읽기 · Secrets 없음 · 의존성 설치는 여기서만)
#   sign      업데이트 파일에 .sig — Tauri CLI 한 꾸러미만 받아 서명      (읽기 · **서명 키는 이 작업에서만**)
#   manifest  latest.json 만들기 — 저장소의 의존 없는 스크립트 한 개       (읽기 · Secrets 없음)
#   publish   초안 릴리스 만들기 · 파일 올리기 (태그 push 일 때만)        (**쓰기는 이 작업에서만** · 저장소 코드 안 돎)
# 이 분리는 "오염된 빌드 한 번"(그 빌드가 만든 파일이 서명되는 것)은 못 막는다. 대신 키가 새어 뒤로 아무 때나 서명되는 일은 막는다.
#
# 서명 키(TAURI_SIGNING_PRIVATE_KEY · TAURI_SIGNING_PRIVATE_KEY_PASSWORD)는 저장소 Secrets 에서 sign 작업의 한 단계 env 에서만 쓴다.
# pull_request 로는 돌지 않으니 포크 PR 은 키에 닿을 수 없다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 태그와 판 번호 확인
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 태그 = v + package.json 판 (네 파일이 모두 그 판인지까지)
        id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            case "$TAG" in
              v*) ;;
              *) echo "태그 이름이 v 로 시작하지 않는다: $TAG" >&2; exit 1 ;;
            esac
            VERSION="${TAG#v}"
          else
            # 수동 실행 — 태그가 없으니 package.json 판과 나머지 파일이 같은지만 본다.
            VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          fi
          node scripts/set-version.mjs --check "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md 에서 이 판의 바뀐 점 (릴리스 본문 · latest.json notes = 앱 「바뀐 점」)
        run: |
          set -euo pipefail
          mkdir notes
          node scripts/release-notes.mjs "$VERSION" > notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  build:
    name: 빌드 (${{ matrix.name }})
    needs: verify
    # 키도 쓰기 토큰도 없다. 이 작업은 의존성 코드를 돌린다.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # latest.json 합치기와 릴리스 만들기는 이 작업에 없다 (sign · manifest · publish 가 한 번씩) — 빌드는 동시에 돌려도 된다.
      matrix:
        include:
          - name: Windows
            slug: windows
            os: windows-latest
            target: ''
            macArch: ''
          - name: macOS Apple Silicon
            slug: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            macArch: aarch64
          - name: macOS Intel
            slug: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            macArch: x64
          - name: Linux
            slug: linux
            os: ubuntu-22.04
            target: ''
            macArch: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Linux 빌드 의존 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust stable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      # 설치 스크립트를 끈다 — e2e 드라이버(edgedriver · geckodriver)를 받는 스크립트가 안 돈다.
      # esbuild · vite(rolldown) · tauri CLI 의 플랫폼 바이너리는 optionalDependencies 로 와서 스크립트 없이도 된다.
      - run: npm ci --ignore-scripts
      # 업데이트 서명(createUpdaterArtifacts)은 꺼져 있다 (tauri.conf.json 에 없음) — 키 없이 빌드된다.
      - name: 빌드
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            npm run tauri build -- --target "$TARGET"
          else
            npm run tauri build
          fi
      # 업데이트 파일은 여기서 만든다 (서명은 sign 작업):
      #   Windows NSIS `*-setup.exe` 그대로 · Linux `.AppImage` 그대로 · macOS 는 `.app` 을 `.app.tar.gz` 로 (권한 · 링크 보존).
      - name: 설치본 · 업데이트 파일 모으기
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
          MAC_ARCH: ${{ matrix.macArch }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            BUNDLE="src-tauri/target/$TARGET/release/bundle"
          else
            BUNDLE="src-tauri/target/release/bundle"
          fi
          mkdir release-files
          shopt -s nullglob
          # 패턴에 맞는 파일이 정확히 하나여야 한다 — 없거나 둘 이상이면 어느 파일인지 모르니 멈춘다.
          one() {
            local files=($1)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::'$1' 에 맞는 파일이 ${#files[@]}개다 (하나여야 한다)"
              find "$BUNDLE" -maxdepth 2 >&2 || true
              exit 1
            fi
            cp -- "${files[0]}" release-files/
          }
          case "$RUNNER_OS" in
            Windows)
              one "$BUNDLE/nsis/*-setup.exe"
              ;;
            Linux)
              one "$BUNDLE/appimage/*.AppImage"
              one "$BUNDLE/deb/*.deb"
              ;;
            macOS)
              one "$BUNDLE/dmg/*.dmg"
              apps=("$BUNDLE"/macos/*.app)
              if [ "${#apps[@]}" -ne 1 ]; then
                echo "::error::.app 이 ${#apps[@]}개다 (하나여야 한다)" >&2
                exit 1
              fi
              APP_NAME="$(basename "${apps[0]}")"
              TAR_NAME="${APP_NAME%.app}_${VERSION}_${MAC_ARCH}.app.tar.gz"
              # COPYFILE_DISABLE — macOS 의 tar 가 확장 속성을 `._이름` 파일로 끼워 넣지 않게.
              COPYFILE_DISABLE=1 tar -czf "release-files/$TAR_NAME" -C "$BUNDLE/macos" "$APP_NAME"
              # 업데이터는 첫 경로 조각(`<이름>.app`)을 떼고 푼다 — 묶음 맨 위가 .app 이어야 한다.
              tar -tzf "release-files/$TAR_NAME" > "$RUNNER_TEMP/tar-list.txt"
              [ "$(sed -n 1p "$RUNNER_TEMP/tar-list.txt")" = "$APP_NAME/" ] || { echo "::error::$TAR_NAME 맨 위가 $APP_NAME/ 가 아니다" >&2; exit 1; }
              grep -q "^$APP_NAME/Contents/MacOS/" "$RUNNER_TEMP/tar-list.txt" || { echo "::error::$TAR_NAME 에 실행 파일이 없다" >&2; exit 1; }
              if grep -q '/\._' "$RUNNER_TEMP/tar-list.txt"; then echo "::error::$TAR_NAME 에 ._ 확장 속성 파일이 섞였다" >&2; exit 1; fi
              ;;
            *)
              echo "::error::모르는 OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          ls -l release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.slug }}
          path: release-files/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  sign:
    name: 업데이트 파일 서명
    needs: [verify, build]
    # 서명 키가 있는 유일한 작업 — 저장소를 받지 않고, 의존성을 설치하지 않는다.
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-files
      - name: 업데이트 파일마다 .sig
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
          # Tauri CLI 판 — package-lock.json 의 @tauri-apps/cli 판과 같게 (scripts/updater-manifest.test.mjs 가 맞는지 본다).
          TAURI_CLI_VERSION: 2.12.2
          # 받은 꾸러미의 설치 스크립트는 돌리지 않는다.
          npm_config_ignore_scripts: 'true'
          npm_config_update_notifier: 'false'
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::저장소 Secrets 에 TAURI_SIGNING_PRIVATE_KEY 가 없다" >&2
            exit 1
          fi
          ROOT="$PWD/release-files"
          shopt -s nullglob
          # 업데이트 파일 — 정확히 네 개 (Windows · macOS 둘 · Linux). 미리 놓인 .sig 가 있으면 멈춘다.
          files=("$ROOT"/*-setup.exe "$ROOT"/*_aarch64.app.tar.gz "$ROOT"/*_x64.app.tar.gz "$ROOT"/*.AppImage)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::업데이트 파일이 ${#files[@]}개다 (네 개여야 한다)" >&2
            ls -l "$ROOT" >&2
            exit 1
          fi
          pre=("$ROOT"/*.sig)
          if [ "${#pre[@]}" -ne 0 ]; then
            echo "::error::서명 전에 .sig 가 이미 있다: ${pre[*]}" >&2
            exit 1
          fi
          # 받은 파일이 있는 폴더가 아닌 빈 폴더에서 npx 를 돌린다 (그 폴더의 설정 · package.json 을 읽지 않게).
          mkdir "$RUNNER_TEMP/signer"
          cd "$RUNNER_TEMP/signer"
          for f in "${files[@]}"; do
            # 키 · 비밀번호는 env 로만 읽힌다 (명령줄에 쓰지 않는다). 판을 서명에 묶는다 (`tauri build` 가 하던 것).
            npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" signer sign --app-version "$VERSION" "$f"
          done
          sigs=("$ROOT"/*.sig)
          if [ "${#sigs[@]}" -ne 4 ]; then
            echo "::error::.sig 가 ${#sigs[@]}개다 (네 개여야 한다)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-signatures
          path: release-files/*.sig
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  manifest:
    name: latest.json 만들기
    needs: [verify, build, sign]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # 의존성 설치 없음 — Node 내장만 쓰는 저장소 스크립트. 네 플랫폼 중 하나라도 빠지면 실패한다.
      - name: latest.json
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --dir release-files \
            --notes-file notes/notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --out latest.json
          cat latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-latest-json
          path: latest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # 태그를 올렸을 때만. 수동 실행은 여기까지 만든 artifact(bundle-* 여섯 개 · release-notes)가 결과다.
  publish:
    name: 초안 릴리스 올리기
    if: github.event_name == 'push'
    needs: [verify, manifest]
    # 쓰기 권한은 이 작업에만 — 저장소 코드 · 의존성 설치 없이 받은 파일을 올리기만 한다.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: 초안 릴리스 만들고 파일 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -uo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::태그($TAG)와 판(v$VERSION)이 다르다" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(assets/*)
          # 올린 이름이 latest.json 의 주소와 같도록 — GitHub 가 이름을 바꿀 글자가 있으면 멈춘다.
          for f in "${files[@]}"; do
            if ! [[ "$(basename "$f")" =~ ^[A-Za-z0-9_-][A-Za-z0-9._-]*[A-Za-z0-9_-]$ ]]; then
              echo "::error::올릴 수 없는 파일 이름: $f" >&2
              exit 1
            fi
          done
          # 파일: 설치본(.exe · .dmg 둘 · .AppImage · .deb) + 업데이트 파일(.app.tar.gz 둘) + .sig 넷 + latest.json = 12개
          if [ "${#files[@]}" -ne 12 ] || [ ! -f assets/latest.json ]; then
            echo "::error::올릴 파일이 ${#files[@]}개다 (latest.json 포함 12개여야 한다)" >&2
            ls -l assets >&2
            exit 1
          fi
          # 같은 태그의 릴리스(초안이든 공개든)가 이미 있으면 덮어쓰지 않고 멈춘다.
          if existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "::error::$TAG 릴리스가 이미 있다 — 덮어쓰지 않는다. 지우고 다시 하려면 릴리스를 직접 지운 뒤 이 실행을 다시 돌린다." >&2
            exit 1
          fi
          case "$existing" in
            *"release not found"*) ;;
            *)
              echo "::error::릴리스 확인에 실패했다: $existing" >&2
              exit 1
              ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Nyanitor v$VERSION" \
            --notes-file notes/notes.md \
            "${files[@]}"

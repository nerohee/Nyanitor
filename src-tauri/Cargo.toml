[package]
name = "nyanitor"
version = "0.1.0"
description = "Nyanitor — claude-harness 를 고양이 집으로 쓰는 데스크톱 앱"
authors = ["nerohee"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nyanitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"

# 앱 DB (프로젝트 목록 등, D-20 · D-47) — SQLite 를 앱에 같이 넣어(`bundled`) PC 에 SQLite 가 없어도 된다. src/db/ 에서만 연다.
rusqlite = { version = "0.41", features = ["bundled"] }
# 폴더 고르기 대화상자 — Rust 에서만 쓴다 (D-47). 화면 권한(`capabilities/`)에는 dialog 를 열지 않는다.
tauri-plugin-dialog = "2"

# 자식 프로세스 트리를 한꺼번에 끄기 (claude 가 시킨 bash · node 가 남지 않게) — src/claude/process_tree.rs 에서만 쓴다.
# Windows 는 Job Object (앱이 비정상 종료해도 OS 가 자식을 끈다), 그 밖에는 프로세스 그룹.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # 앱이 쓴 츄르의 "오늘" 을 이 PC 의 자정부터 세려고 시간대를 읽는다 — src/history/usage.rs 에서만 쓴다.
    "Win32_System_Time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
# 시험용 가짜 claude (P3-02). `cargo build` · `tauri build` 는 예제를 만들지 않으므로 설치본에 들어가지 않는다.
name = "fake_claude"
path = "examples/fake_claude.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
